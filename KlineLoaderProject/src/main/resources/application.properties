spring.application.name=kline-producer

# ── 数据库配置（查询用）──
spring.datasource.url=jdbc:postgresql://kline-db.cdweya8um8kq.us-east-2.rds.amazonaws.com:5432/klinedb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── MyBatis 配置 ──
mybatis.type-aliases-package=com.example.demo.model
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ── Kafka Producer 配置 ──
spring.kafka.bootstrap-servers=172.31.2.188:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ── Binance API ──
url-template=https://api.binance.us/api/v3/klines?symbol=%s&interval=1m&startTime=%s&endTime=%s&limit=%s

# ── Realtime WebSocket ──
realtime.enabled=true
realtime.symbols=btcusdt,ethusdt,solusdt
realtime.ws-base=wss://stream.binance.us:9443
